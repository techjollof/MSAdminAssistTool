    - name: Sync Help Markdown Files and Images to Wiki
      run: |
        echo "Starting sync process..."
        echo "Repository structure:"
        find . -type d -maxdepth 2 | sort
        
        # Clear wiki content for a clean start (except .git directory)
        find wiki -mindepth 1 -path "wiki/.git" -prune -o -exec rm -rf {} \; 2>/dev/null || true
        mkdir -p wiki
        
        # Define known module names
        MODULES="EntraIDAdmin EXOAdmin SCCAdmin SPOAdmin TeamsAdmin"
        
        echo "Processing markdown files and images..."
        
        # First handle projects under modules
        for module in $MODULES; do
          if [ -d "$module" ]; then
            echo "Processing module: $module"
            module_has_content=false
            
            for project in "$module"/*/; do
              if [ -d "$project" ]; then
                projectname=$(basename "$project")
                
                # Find Help directory (case insensitive)
                helpDir=$(find "$project" -maxdepth 1 -type d -iname "help" | head -n 1)
                
                if [ -n "$helpDir" ]; then
                  # Check for either markdown files or images
                  if [ -n "$(find "$helpDir" \( -name "*.md" -o -name "*.png" -o -name "*.jpg" -o -name "*.gif" \) -print -quit)" ]; then
                    if [ "$module_has_content" = false ]; then
                      mkdir -p "wiki/$module"
                      module_has_content=true
                    fi
                    
                    echo "  Processing project: $projectname (has Help content)"
                    mkdir -p "wiki/$module/$projectname"
                    
                    # Copy all markdown files
                    find "$helpDir" -name "*.md" -type f | while read src_file; do
                      filename=$(basename "$src_file")
                      echo "    Copying $src_file to wiki/$module/$projectname/$filename"
                      cp "$src_file" "wiki/$module/$projectname/$filename"
                    done
                    
                    # Copy all image files (including subdirectories)
                    if [ -d "$helpDir/images" ] || [ -d "$helpDir/Images" ]; then
                      imagesDir=$(find "$helpDir" -maxdepth 1 -type d \( -iname "images" -o -iname "pictures" \) | head -n 1)
                      if [ -n "$imagesDir" ]; then
                        echo "    Copying images from $imagesDir"
                        mkdir -p "wiki/$module/$projectname/images"
                        cp -r "$imagesDir"/* "wiki/$module/$projectname/images/"
                      fi
                    fi
                  else
                    echo "  Skipping project: $projectname (no Help content)"
                  fi
                else
                  echo "  Skipping project: $projectname (no Help directory)"
                fi
              fi
            done
            
            [ "$module_has_content" = false ] && echo "  No Help content found in module: $module"
          else
            echo "Module directory not found in source: $module (skipping)"
          fi
        done
        
        # Then handle root-level projects
        echo "Processing root-level projects..."
        
        find . -maxdepth 1 -type d -not -path "." -not -path "./wiki" -not -path "./.git" -not -path "./.github" | while read rootdir; do
          dirname=$(basename "$rootdir")
          
          # Skip known modules
          if echo "$MODULES" | grep -q -w "$dirname"; then
            echo "  Skipping module directory: $dirname"
            continue
          fi
          
          # Find Help directory (case insensitive)
          helpDir=$(find "$rootdir" -maxdepth 1 -type d -iname "help" | head -n 1)
          
          if [ -n "$helpDir" ]; then
            # Check for either markdown files or images
            if [ -n "$(find "$helpDir" \( -name "*.md" -o -name "*.png" -o -name "*.jpg" -o -name "*.gif" \) -print -quit)" ]; then
              echo "  Processing root project: $dirname (has Help content)"
              mkdir -p "wiki/RootProjects/$dirname"
              
              # Copy all markdown files
              find "$helpDir" -name "*.md" -type f | while read src_file; do
                filename=$(basename "$src_file")
                echo "    Copying $src_file to wiki/RootProjects/$dirname/$filename"
                cp "$src_file" "wiki/RootProjects/$dirname/$filename"
              done
              
              # Copy all image files (including subdirectories)
              if [ -d "$helpDir/images" ] || [ -d "$helpDir/Images" ]; then
                imagesDir=$(find "$helpDir" -maxdepth 1 -type d \( -iname "images" -o -iname "pictures" \) | head -n 1)
                if [ -n "$imagesDir" ]; then
                  echo "    Copying images from $imagesDir"
                  mkdir -p "wiki/RootProjects/$dirname/images"
                  cp -r "$imagesDir"/* "wiki/RootProjects/$dirname/images/"
                fi
              fi
            else
              echo "  Skipping root project: $dirname (no Help content)"
            fi
          else
            echo "  Skipping root project: $dirname (no Help directory)"
          fi
        done
        
        echo "Sync process completed successfully"
        
