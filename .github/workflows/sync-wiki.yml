name: Sync help Markdown Files to Wiki

on:
  push:
    branches:
      - main
    paths:
      - '**/help/**/*.md'
      - '.github/workflows/sync-wiki.yml'

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 1  # Only need latest commit

    - name: Debug Information
      run: |
        echo "GitHub ref: ${{ github.ref }}"
        echo "GitHub event name: ${{ github.event_name }}"
        echo "Working directory:"
        pwd
        echo "Repository contents:"
        ls -la
        echo "help directories:"
        find . -type d -path "*/help" || echo "No help directories found"
        echo "Markdown files in help directories:"
        find . -type f -path "*/help/*.md" || echo "No markdown files found"
      
    - name: Set Up Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
    - name: Clone Wiki Repo
      run: |
        if git clone https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git wiki; then
          echo "Wiki cloned successfully"
        else
          echo "No wiki exists yet, creating new wiki directory"
          mkdir -p wiki
          cd wiki
          git init
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
          cd ..
        fi
        
    - name: Sync help Markdown Files to Wiki
      run: |
        # Clear existing wiki content (except .git)
        if [ -d "wiki/.git" ]; then
          find wiki -mindepth 1 -name ".git" -prune -o -exec rm -rf {} \; || true
        fi
        
        # Define known module names
        MODULES="EntraIDAdmin EXOAdmin SCCAdmin SPOAdmin TeamsAdmin"
        
        # Process module projects
        for module in $MODULES; do
          if [ -d "$module" ]; then
            echo "Processing module: $module"
            
            for project in "$module"/*/; do
              if [ -d "$project" ]; then
                projectname=$(basename "$project")
                echo "  Processing project: $projectname"
                
                if [ -d "$project/help" ]; then
                  mkdir -p "wiki/$module/$projectname"
                  find "$project/help" -name "*.md" -exec cp {} "wiki/$module/$projectname/" \;
                fi
              fi
            done
          fi
        done
        
        # Process root-level projects
        echo "Processing root-level projects..."
        mkdir -p "wiki/RootProjects"
        
        find . -maxdepth 1 -type d -not -path "." -not -path "./wiki" -not -path "./.git" -not -path "./.github" | while read rootdir; do
          dirname=$(basename "$rootdir")
          
          if echo "$MODULES" | grep -q -w "$dirname"; then
            continue
          fi
          
          if [ -d "$rootdir/help" ]; then
            mkdir -p "wiki/RootProjects/$dirname"
            find "$rootdir/help" -name "*.md" -exec cp {} "wiki/RootProjects/$dirname/" \;
          fi
        done
        
    - name: Generate Wiki Index Pages
      run: |
        cd wiki
        echo "# Admin Tools Wiki" > Home.md
        echo "" >> Home.md
        
        MODULES="EntraIDAdmin EXOAdmin SCCAdmin SPOAdmin TeamsAdmin"
        
        # Generate module index pages
        for module in $MODULES; do
          if [ -d "$module" ]; then
            echo "- [$module]($module)" >> Home.md
            echo "# $module Documentation" > "$module.md"
            echo "" >> "$module.md"
            
            for projectDir in "$module"/*/; do
              if [ -d "$projectDir" ]; then
                projectname=$(basename "$projectDir")
                echo "## $projectname" >> "$module.md"
                
                find "$projectDir" -name "*.md" | while read mdfile; do
                  filename=$(basename "$mdfile")
                  title=$(head -n 1 "$mdfile" | sed -n 's/^#\s*//p' || echo "$filename")
                  echo "- [$title]($module/$projectname/$filename)" >> "$module.md"
                done
                
                echo "" >> "$module.md"
              fi
            done
          fi
        done
        
        # Generate RootProjects index
        if [ -d "RootProjects" ]; then
          echo "" >> Home.md
          echo "## Independent Projects" >> Home.md
          echo "- [Root Projects](RootProjects)" >> Home.md
          
          echo "# Independent Projects" > RootProjects.md
          echo "" >> RootProjects.md
          
          for projectDir in RootProjects/*/; do
            if [ -d "$projectDir" ]; then
              projectname=$(basename "$projectDir")
              echo "## $projectname" >> RootProjects.md
              
              find "$projectDir" -name "*.md" | while read mdfile; do
                filename=$(basename "$mdfile")
                title=$(head -n 1 "$mdfile" | sed -n 's/^#\s*//p' || echo "$filename")
                echo "- [$title](RootProjects/$projectname/$filename)" >> RootProjects.md
              done
              
              echo "" >> RootProjects.md
            fi
          done
        fi
        
    - name: Commit and Push to Wiki
      run: |
        cd wiki
        git add .
        
        if ! git diff --cached --quiet; then
          git commit -m "Sync help documentation (automated update)"
          git push origin HEAD:main
          echo "Wiki updated successfully"
        else
          echo "No changes to commit"
        fi