name: Sync Help Docs to Wiki

on:
  push:
    branches:
      - MSAdminAssistTool
    paths:
      - '**/Help/*.md'
  schedule:
    - cron: '0 3 * * *'  # Optional: runs daily at 03:00 UTC
  workflow_dispatch:

jobs:
  sync-wiki:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set Git Identity
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Clone Wiki Repository
      run: |
        git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git wiki

    - name: Copy Help Markdown Files
      run: |
        mkdir -p wiki_tmp
        find . -type f -path "*/Help/*.md" ! -path "./wiki/*" | while read filepath; do
          filename=$(basename "$filepath")
          cp "$filepath" "wiki_tmp/$filename"
        done
        cp wiki_tmp/*.md wiki/

    - name: Generate Main Wiki Pages
      run: |
        cd wiki
        for module in EntraIDAdmin EXOAdmin SCCAdmin SPOAdmin TeamsAdmin; do
          echo "# $module Help Files" > "$module.md"
          find ../$module -type f -path "*/Help/*.md" | while read mdfile; do
            fname=$(basename "$mdfile")
            echo "- [$fname]($fname)" >> "$module.md"
          done
        done

    - name: Commit and Push to Wiki
      run: |
        cd wiki
        git add .
        git commit -m "Auto-sync Help markdown files to wiki [skip ci]" || echo "Nothing to commit"
        git push
