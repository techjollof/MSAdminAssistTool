name: Sync Help Markdown Files to Wiki

on:
  push:
    branches:
      - main
    paths:
      - '**/help/**/*.md'
      - '.github/workflows/sync-wiki.yml'  # Allow the workflow itself to trigger

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for proper change detection
      
    - name: Debug Information
      run: |
        echo "GitHub ref: ${{ github.ref }}"
        echo "GitHub event name: ${{ github.event_name }}"
        echo "Working directory:"
        pwd
        echo "Repository contents:"
        ls -la
        echo "Help directories:"
        find . -type d -path "*/Help" || echo "No Help directories found"
        echo "Markdown files in Help directories:"
        find . -type f -path "*/Help/*.md" || echo "No markdown files found"
      
    - name: Set Up Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
    - name: Clone Wiki Repo
      run: |
        echo "Attempting to clone wiki repository..."
        git clone https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git wiki || echo "No wiki exists yet, creating new wiki"
        mkdir -p wiki
        
    - name: Sync Help Markdown Files to Wiki
      run: |
        echo "Starting sync process..."
        echo "Repository structure:"
        find . -type d -maxdepth 2 | sort
        
        # Clear wiki content for a clean start (except .git directory)
        find wiki -mindepth 1 -path "wiki/.git" -prune -o -exec rm -rf {} \; 2>/dev/null || true
        mkdir -p wiki
        
        # Define known module names - add all your actual modules here
        MODULES="EntraIDAdmin EXOAdmin SCCAdmin SPOAdmin TeamsAdmin"
        
        # Process all markdown files in Help directories with specific handling for modules vs root projects
        echo "Processing markdown files..."
        
        # First handle projects under modules (standard hierarchy)
        for module in $MODULES; do
          if [ -d "$module" ]; then
            echo "Processing module: $module"
            
            for project in "$module"/*/; do
              if [ -d "$project" ]; then
                projectname=$(basename "$project")
                echo "  Processing project under module: $projectname in $module"
                
                # Create project directory in wiki
                mkdir -p "wiki/$module/$projectname"
                
                # Find and copy help markdown files for this project
                if [ -d "$project/Help" ]; then
                  echo "    Found Help directory"
                  find "$project/Help" -name "*.md" -type f | while read src_file; do
                    filename=$(basename "$src_file")
                    echo "    Copying $src_file to wiki/$module/$projectname/$filename"
                    cp "$src_file" "wiki/$module/$projectname/$filename" || echo "Failed to copy $src_file"
                  done
                else
                  echo "    No Help directory found in $project"
                fi
              fi
            done
          else
            echo "Module directory not found: $module"
          fi
        done
        
        # Then handle root-level projects (treating them as their own category)
        echo "Processing root-level projects..."
        mkdir -p "wiki/RootProjects"
        
        # Find all directories at root level that aren't modules or special directories
        find . -maxdepth 1 -type d -not -path "." -not -path "./wiki" -not -path "./.git" -not -path "./.github" | while read rootdir; do
          dirname=$(basename "$rootdir")
          
          # Skip if this is a known module
          if echo "$MODULES" | grep -q -w "$dirname"; then
            echo "  Skipping module directory: $dirname"
            continue
          fi
          
          echo "  Processing root project: $dirname"
          
          # Create project directory in wiki under RootProjects
          mkdir -p "wiki/RootProjects/$dirname"
          
          # Find and copy help markdown files for this project
          if [ -d "$rootdir/Help" ]; then
            echo "    Found Help directory"
            find "$rootdir/Help" -name "*.md" -type f | while read src_file; do
              filename=$(basename "$src_file")
              echo "    Copying $src_file to wiki/RootProjects/$dirname/$filename"
              cp "$src_file" "wiki/RootProjects/$dirname/$filename" || echo "Failed to copy $src_file"
            done
          else
            echo "    No Help directory found in $rootdir"
          fi
        done
        
    - name: Generate Main Wiki Pages
      run: |
        cd wiki
        echo "Generating wiki index pages..."
        
        # Create Home page that links to all modules
        echo "# Admin Tools Wiki" > Home.md
        echo "" >> Home.md
        echo "## Admin Modules" >> Home.md
        
        # Define known module names - make sure this matches the list in the previous step
        MODULES="EntraIDAdmin EXOAdmin SCCAdmin SPOAdmin TeamsAdmin"
        
        # Process standard modules first
        for module in $MODULES; do
          echo "Processing module index: $module"
          
          # Only add module to home page if it has content
          if [ -d "$module" ] && [ "$(find "$module" -type f -name "*.md" | wc -l)" -gt 0 ]; then
            echo "- [$module]($module)" >> Home.md
            
            # Create the module index page
            echo "# $module Help Files" > "$module.md"
            echo "" >> "$module.md"
            
            # Add links to each project
            for projectDir in "$module"/*/; do
              if [ -d "$projectDir" ] && [ "$(find "$projectDir" -type f -name "*.md" | wc -l)" -gt 0 ]; then
                projectname=$(basename "$projectDir")
                echo "  Adding project to index: $projectname"
                echo "## $projectname" >> "$module.md"
                
                # Add links to each markdown file in the project
                find "$projectDir" -name "*.md" -type f | sort | while read mdfile; do
                  filename=$(basename "$mdfile")
                  # Extract title from first heading in the file, or use filename if no heading
                  title=$(head -n 1 "$mdfile" | grep '^#' | sed 's/^#\s*//' || echo "$filename")
                  echo "- [$title]($module/$projectname/$filename)" >> "$module.md"
                done
                
                echo "" >> "$module.md"
              fi
            done
          else
            echo "  Module has no content, skipping"
          fi
        done
        
        # Add Root Projects section
        if [ -d "RootProjects" ] && [ "$(find "RootProjects" -type f -name "*.md" | wc -l)" -gt 0 ]; then
          echo "" >> Home.md
          echo "## Independent Projects" >> Home.md
          echo "- [Independent Projects](RootProjects)" >> Home.md
          
          # Create RootProjects index page
          echo "# Independent Projects" > "RootProjects.md"
          echo "" >> "RootProjects.md"
          echo "These projects exist at the root level and are not part of a specific module." >> "RootProjects.md"
          echo "" >> "RootProjects.md"
          
          # Add each root project
          for projectDir in "RootProjects"/*/; do
            if [ -d "$projectDir" ] && [ "$(find "$projectDir" -type f -name "*.md" | wc -l)" -gt 0 ]; then
              projectname=$(basename "$projectDir")
              echo "  Adding root project to index: $projectname"
              echo "## $projectname" >> "RootProjects.md"
              
              # Add links to each markdown file in the project
              find "$projectDir" -name "*.md" -type f | sort | while read mdfile; do
                filename=$(basename "$mdfile")
                # Extract title from first heading in the file, or use filename if no heading
                title=$(head -n 1 "$mdfile" | grep '^#' | sed 's/^#\s*//' || echo "$filename")
                echo "- [$title](RootProjects/$projectname/$filename)" >> "RootProjects.md"
              done
              
              echo "" >> "RootProjects.md"
            fi
          done
        fi
        
        # List generated files
        echo "Generated wiki files:"
        find . -type f -name "*.md" | sort
        
    - name: Commit and Push to Wiki
      run: |
        cd wiki
        echo "Committing changes to wiki..."
        
        # Configure authentication for pushing
        git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git
        
        # Add all changes
        git add .
        
        # Only commit if there are changes
        if ! git diff --quiet --cached; then
          git commit -m "Sync Help Markdown files to wiki - automated update"
          # Push changes to the wiki repository
          echo "Pushing changes to wiki repository..."
          git push && echo "Wiki updated successfully!" || echo "Failed to push to wiki repository"
        else
          echo "No changes to commit"
        fi