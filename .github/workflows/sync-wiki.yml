name: Sync Help Markdown Files to Wiki

on:
  push:
    paths:
      - '**/Help/**/*.md'

jobs:
  sync-wiki:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v3

    - name: Set Up Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Clone Wiki Repo
      run: |
        git clone https://github.com/${{ github.repository }}.wiki.git wiki

    - name: Copy .md Files to Wiki
      run: |
        find . -type f -path "*/Help/*.md" | while read file; do
          cp "$file" "wiki/$(basename "$file")"
        done

    - name: Generate Main Wiki Pages
      run: |
        cd wiki
        for module in EntraIDAdmin EXOAdmin SCCAdmin SPOAdmin TeamsAdmin; do
          echo "# $module Help Files" > "$module.md"
          for project in ../$module/*/; do
            projectname=$(basename "$project")
            echo -e "\n## $projectname" >> "$module.md"
            find "$project" -type f -path "*/Help/*.md" | while read mdfile; do
              fname=$(basename "$mdfile")
              echo "- [$fname]($fname)" >> "$module.md"
            done
          done
        done

    - name: Commit and Push to Wiki
      run: |
        cd wiki
        git add .
        git commit -m "Sync Help Markdown files to wiki" || echo "No changes to commit"
        git push
